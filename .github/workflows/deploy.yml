name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only non-runtime documentation: mixed pushes still run every check and deploy.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'DECISIONS.md'
      - 'DATA_SOURCES.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'design-qa.md'
      - 'pipeline/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Share the local Node major selection; package.json declares the supported range.
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
        with:
          # Kept deliberately: it cannot create the Pages site (the built-in token lacks that
          # permission — the site was enabled by hand once, DECISIONS.md), but it succeeds now
          # that the site exists.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
